<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
	<h2>Conditional (if)</h2>
	<p th:if="${num1>num2}">
		<span th:text="${num1}+' is greater than '+${num2}"></span>
	</p>
	<p th:if="${num1<num2}">
		<span th:text="${num2}+' is greater than '+${num1}"></span>
	</p>
</body>

</html>
